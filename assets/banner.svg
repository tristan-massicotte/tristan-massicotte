<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Tristan Massicotte, Industrial Engineering, University of Toronto">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#1c3150"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>

  <!-- a cycle-time chart that keeps going down: the "optimize" motif -->
  <g transform="translate(820 70)">
    <g fill="#4d8ef0">
      <rect x="0"   y="20"  width="34" height="140" rx="4" fill-opacity="0.35"/>
      <rect x="50"  y="50"  width="34" height="110" rx="4" fill-opacity="0.45"/>
      <rect x="100" y="78"  width="34" height="82"  rx="4" fill-opacity="0.6"/>
      <rect x="150" y="104" width="34" height="56"  rx="4" fill-opacity="0.75"/>
      <rect x="200" y="124" width="34" height="36"  rx="4" fill-opacity="0.9"/>
      <rect x="250" y="138" width="34" height="22"  rx="4"/>
    </g>
    <path d="M17 12 L67 42 L117 70 L167 96 L217 116 L267 130" fill="none" stroke="#9cc2ff" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/>
    <line x1="-10" y1="160.5" x2="300" y2="160.5" stroke="#ffffff" stroke-opacity="0.25"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="64" y="128" font-size="56" font-weight="700" letter-spacing="-1">Tristan Massicotte</text>
    <text x="66" y="172" font-size="22" fill="#c9d6ea">Industrial Engineering · University of Toronto</text>
    <text x="66" y="230" font-size="22" font-weight="600" fill="#9cc2ff">Optimize, optimize, optimize.</text>
  </g>
</svg>
